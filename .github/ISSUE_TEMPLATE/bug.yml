name: Bug report
description: Something in the lab, the roxy CLI, a Lab App or the grid runner does not work as the docs say.
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Never paste your roxy secrets or your traffic here.** That means `MITMWEB_PASSWORD`, `LAB_SECRET`, the Public Endpoint URL with its secret segment, anything from `~/.config/roxy/`, a Recording (`.mitm`) or a HAR file: they hold the traffic you captured, your app's headers, cookies and tokens included. If a secret leaked, change it in `~/.config/roxy/secrets.env` and restart the lab.
        >
        > A security problem? Don't open an issue: use private vulnerability reporting (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, in order (`roxy start ...`, `roxy launch ...`, `scripts/grid ...`).
      render: sh
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: "`roxy status --json`"
      description: Its output while the lab runs. It holds no secret; check before pasting anyway.
      render: json
  - type: textarea
    id: result
    attributes:
      label: Result line or grid row
      description: The `LABRESULT` line, or the grid's row for the cell, or the error the command printed.
      render: text
  - type: dropdown
    id: device-kind
    attributes:
      label: Target Device kind
      options:
        - Physical Device
        - Cloud Device
        - Both
        - None (no device involved)
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - classic Lab App
        - RSG 2.0 Lab App
        - Product App (Charles hook)
        - Product App (kit)
        - None
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: roxy commit (`git -C <checkout> rev-parse --short HEAD`), mitmproxy (pinned 12.3.1 unless you changed it), macOS, Roku OS.
