# The lab under Docker Compose: the same addon chain, config, scenarios and
# mitmweb flags (scripts/run-mitmweb) as scripts/start-lab, mounted from the repo.
# Settings and secrets come from the settings root, as for scripts/start-lab:
# ROXY_CONFIG_DIR, else roxy in the user config directory (scripts/lib.sh). Sessions
# are saved to the same user data directory too.
#   docker compose up                    # LAN listener only (Physical Devices)
#   docker compose --profile tunnel up   # plus the quick tunnel (Cloud Devices)
# Ports match scripts/lib.sh: 8080 and 8888 LAN listeners, 8081 UI, 8082 tunnel listener.
# CA Routing is not wired here; it runs with scripts/start-lab --ca-routing.
# Under Compose it would need LAB_CA_ROUTING=true, ports 443 and 80 published, and a
# persistent mitmproxy confdir volume (/home/mitmproxy/.mitmproxy): the container
# makes a new CA each time otherwise, and the CA Routing build ships that CA.
# Proxy Routing is not wired here either: its listener, 8090, is not published; it runs
# with scripts/start-lab.
name: roxy

services:
  mitmweb:
    image: mitmproxy/mitmproxy:12.3.1  # the version pinned in proxy/pyproject.toml
    user: mitmproxy
    entrypoint: ["/lab/scripts/run-mitmweb", "mitmweb"]
    # MITMWEB_PASSWORD (required: run-mitmweb names it if empty) and LAB_SECRET (empty:
    # every tunnel request is refused).
    env_file: ${ROXY_CONFIG_DIR:-${XDG_CONFIG_HOME:-${HOME}/.config}/roxy}/secrets.env
    environment:
      ROXY_CONFIG_DIR: /lab/settings
      XDG_DATA_HOME: /lab/data
      LAB_REPLAY: ${LAB_REPLAY:-}  # replay mode: a Recording, relative to the Recordings folder
      LAB_LOCAL_HOST: 0.0.0.0      # the ports below keep the UI and tunnel listener local
      # Docker Desktop's host address replaces the LAN subnets: on macOS every published-port
      # client arrives from 192.168.65.1 (docs/compose.md).
      LAB_LAN_SUBNETS: ${LAB_LAN_SUBNETS:-192.168.65.1/32}
      PYTHONUNBUFFERED: "1"        # mitmweb's log shows in `docker compose logs` as it happens
    ports:
      - "8080:8080"            # LAN listener, for Physical Devices
      - "8888:8888"            # second LAN listener: Charles's port, which client hooks hardcode
      - "127.0.0.1:8081:8081"  # mitmweb UI, localhost only
      # 8082, the tunnel listener, is not published: only cloudflared reaches it.
      # 8090, the Proxy Routing listener, is not published: Proxy Routing is native only.
    volumes:
      - ./proxy:/lab/proxy:ro
      - ./scripts:/lab/scripts:ro
      - ${ROXY_CONFIG_DIR:-${XDG_CONFIG_HOME:-${HOME}/.config}/roxy}:/lab/settings:ro
      # every session is saved here; must be writable by the image's uid 1000
      - ${XDG_DATA_HOME:-${HOME}/.local/share}/roxy:/lab/data/roxy

  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    profiles: [tunnel]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://mitmweb:8082
    ports:
      - "127.0.0.1:20241:20241"  # metrics: /ready and /quicktunnel (the tunnel's hostname)
    depends_on: [mitmweb]
