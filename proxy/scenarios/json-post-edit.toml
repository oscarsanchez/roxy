# The JSON POST case's request body is edited before it reaches the Origin, so the
# body httpbin echoes back (the result line's fp) changes; sentfp stays as sent.
# roxy launch --scenario json-post-edit "Living Room" case=json_post

[[rule]]
name = "json post sends ok=false"
filter = "~q & ~d httpbin.org & ~u /post"
body = { pattern = '"ok":true', replacement = '"ok":false' }
