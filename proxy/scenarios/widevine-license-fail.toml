# The Widevine case's license request is denied (403; the Origin body is kept).
# The manifest and segments are untouched, so only the license step fails.
# roxy launch --scenario widevine-license-fail "Living Room" case=widevine

[[rule]]
name = "widevine license denied"
filter = "~d proxy.uat.widevine.com & ~u /proxy"
status = 403
