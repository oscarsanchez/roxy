[project]
name = "roxy-proxy"
version = "0.1.0"
description = "mitmproxy addons for the roxy lab"
requires-python = ">=3.12"
dependencies = ["mitmproxy==12.3.1"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:ldap3.*"]  # a mitmproxy dependency's own imports
